<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoL Pizza Store — East US</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; }
      main { max-width: 680px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 24px; }
      table { width: 100%; border-collapse: collapse; margin-top: 16px; }
      th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e8f0; }
      th { background: #f1f5f9; }
    </style>
  </head>
  <body>
    <main>
      <h1>Month of Pizza Lunches - East US</h1>
      <p>Welcome to a basic static HTML page powered by Azure Web Apps and Traffic Manager! Here are some of the yummy pizzas you can soon order online!</p>
      <table>
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Cost</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Pepperoni</td><td>$18</td></tr>
          <tr><td>Veggie</td><td>$15</td></tr>
          <tr><td>Hawaiian</td><td>$12</td></tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
